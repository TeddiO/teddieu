
name: Build and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pnpm cutoff bypass
        id: pnpm-cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].labels[].name' |
            grep -Fxq "bypass-pnpm-cutoff"; then
            echo "bypass=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bypass=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Bypass pnpm release age cutoff
        if: steps.pnpm-cutoff.outputs.bypass == 'true'
        run: pnpm config set minimumReleaseAge 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build App
        run: pnpm build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          environment: production
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/ --project-name=teddieu-landing-page
